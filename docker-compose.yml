services:
  app:
    image: ghcr.io/fc3c13b/line_aistudio:latest
    container_name: my-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      # 会話データや将来の写真・動画などの保存用ディレクトリ
      - ./data:/app/data
      - ./uploads:/app/uploads

  # コンテナの自動更新ツール（Watchtower）
  # GitHub Packages に新しいイメージがプッシュされたら自動でNAS上のコンテナをリロードします
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 my-app # 5分（300秒）おきに更新チェック
